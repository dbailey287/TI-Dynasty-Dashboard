name: Weekly Update Poster

on:
  workflow_dispatch:         # manual only -- run this once all of a week's
    inputs:                  # data is in (schedule, bracket, recruiting)
      season:
        description: "Season year to report on. Leave blank to auto-default to the newest season on disk."
        required: false
        type: string
      send_power_rankings:
        description: "Send Power Rankings"
        required: false
        type: boolean
        default: true
      send_cfp_rankings:
        description: "Send CFP Rankings"
        required: false
        type: boolean
        default: true
      send_recruiting_rankings:
        description: "Send Recruiting Rankings (uncheck if it hasn't changed since last time)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read              # this script only reads existing CSVs and posts to Discord, never commits anything

jobs:
  post_update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas requests

      - name: Post weekly update
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          WEEKLY_UPDATE_CHANNEL_ID: ${{ secrets.WEEKLY_UPDATE_CHANNEL_ID }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.season }}" ]; then ARGS="$ARGS --season ${{ inputs.season }}"; fi
          if [ "${{ inputs.send_power_rankings }}" = "false" ]; then ARGS="$ARGS --skip-power"; fi
          if [ "${{ inputs.send_cfp_rankings }}" = "false" ]; then ARGS="$ARGS --skip-cfp"; fi
          if [ "${{ inputs.send_recruiting_rankings }}" = "false" ]; then ARGS="$ARGS --skip-recruiting"; fi
          python weekly_update.py $ARGS
