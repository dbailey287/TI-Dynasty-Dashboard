name: RTA Reminder

on:
  schedule:
    # Fires daily at both possible UTC times for 8am Eastern -- the script
    # itself checks the real current Eastern time and no-ops on whichever
    # of these two isn't actually 8am right now, so this stays correct
    # across the DST transition without ever needing manual adjustment.
    - cron: "0 12 * * *"   # 8am EDT (summer)
    - cron: "0 13 * * *"   # 8am EST (winter)
  workflow_dispatch:
    inputs:
      force_run:
        description: "Bypass the day/hour gate (for testing)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check and send reminder
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          RTA_ANNOUNCE_CHANNEL_ID: ${{ secrets.RTA_ANNOUNCE_CHANNEL_ID }}
          RTA_FORCE_RUN: ${{ github.event.inputs.force_run == 'true' && '1' || '0' }}
          PYTHONUNBUFFERED: "1"
        run: python rta_reminder.py
