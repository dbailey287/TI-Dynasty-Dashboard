name: RTA Reminder

on:
  schedule:
    # One fixed trigger, no DST handling -- the exact hour drifts by an
    # hour twice a year (7am vs 8am Eastern depending on the season),
    # which doesn't matter for this. Only fires on Sun/Wed/Fri (cron
    # day-of-week: 0=Sun, 3=Wed, 5=Fri).
    - cron: "0 12 * * 0,3,5"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Bypass the advance-day gate (for testing)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Check and send reminder
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          RTA_MAIN_CHANNEL_ID: ${{ secrets.RTA_MAIN_CHANNEL_ID }}
          RTA_ANNOUNCE_CHANNEL_ID: ${{ secrets.RTA_ANNOUNCE_CHANNEL_ID }}
          SUMMARY_CHANNEL_ID: ${{ secrets.SUMMARY_CHANNEL_ID }}
          ADMIN_LOG_CHANNEL_ID: ${{ secrets.ADMIN_LOG_CHANNEL_ID }}
          RTA_FORCE_RUN: ${{ github.event.inputs.force_run == 'true' && '1' || '0' }}
          PYTHONUNBUFFERED: "1"
        run: python rta_reminder.py
